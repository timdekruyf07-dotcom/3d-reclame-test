<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AISLE 5 STUDIO — diensten in het schap</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f4f1e8; --ink:#1a1a1a; --dots:#b8b3a3; --red:#e0261b; }
  * { box-sizing: border-box; }
  body { margin:0; background:#d9d6cc; color:var(--ink); font:20px/1.3 'VT323','Space Mono',monospace;
         display:grid; grid-template-columns:1fr minmax(360px,440px); gap:24px; padding:0 24px; }
  /* Stage */
  #stage { position:sticky; top:0; height:100vh; }
  #gl { width:100%; height:100%; display:block; }
  #stage .hint { position:absolute; left:0; bottom:20px; width:100%; text-align:center; font-size:18px; letter-spacing:.1em; opacity:.7; pointer-events:none; }
  #stage h1 { position:absolute; top:18px; left:0; margin:0; font:900 clamp(28px,4vw,56px)/0.95 'Arial Black',Arial,sans-serif; letter-spacing:-.02em; pointer-events:none; }
  #stage h1 small { display:block; font:400 20px 'VT323',monospace; letter-spacing:.15em; margin-top:8px; }

  /* Receipt */
  .sheet { background:var(--paper); padding:36px 24px 70px; margin:24px 0;
           background-image:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.018) 2px 3px);
           --z:10px; -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/calc(var(--z)*2) 100%;
           mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/calc(var(--z)*2) 100%; }
  .sheet h2 { margin:0; text-align:center; font-size:34px; letter-spacing:.08em; }
  .center { text-align:center; margin:4px 0; }
  .dash { border:0; border-top:2px dashed var(--ink); margin:14px 0; }
  .line { display:flex; justify-content:space-between; gap:8px; text-transform:uppercase; }
  .line .l { flex:1; overflow:hidden; white-space:nowrap; }
  .line .l::after { content:' ................................................'; color:var(--dots); }
  .sub { color:#555; font-size:15px; }
  .total { font-size:30px; border-top:2px solid var(--ink); padding-top:6px; margin-top:6px; }
  .barcode { width:100%; max-width:260px; display:block; margin:8px auto; fill:var(--ink); }
  .barcode text { fill:var(--ink); }
  button { font:inherit; letter-spacing:.12em; cursor:pointer; border:0; background:var(--ink); color:var(--paper); padding:10px 12px; }
  button:hover, button:focus-visible { background:var(--red); outline:none; }
  button.full { width:100%; margin-top:10px; }
  button.mini { padding:0 8px; margin-left:4px; }
  .aisle button.item { all:unset; display:flex; width:100%; justify-content:space-between; gap:8px; cursor:pointer; text-transform:uppercase; padding:2px 0; }
  .aisle button.item:hover, .aisle button.item:focus-visible, .aisle button.item.on { background:var(--ink); color:var(--paper); }
  .aisle .item .l { flex:1; overflow:hidden; white-space:nowrap; }
  .aisle .item .l::after { content:' ................................................'; opacity:.4; }

  /* Nutrition table */
  .nutrition { border:3px solid var(--ink); padding:6px 8px 10px; font:13px/1.4 'Space Mono',monospace; background:#fff; }
  .nutrition h3 { margin:0; font:900 30px/1 'Arial Black',Arial,sans-serif; border-bottom:10px solid var(--ink); padding-bottom:4px; }
  .nutrition .row { display:flex; justify-content:space-between; border-bottom:1px solid var(--ink); padding:3px 0; }
  .nutrition .row.bold { font-weight:700; border-bottom-width:5px; }
  .nutrition .warn { border:2px solid var(--ink); padding:4px 6px; margin:8px 0 0; font-size:12px; }
  .nutrition .warn::before { content:'⚠ KAN BEVATTEN: '; font-weight:700; }
  .nutrition button { font:700 14px 'Space Mono',monospace; }

  /* Print animation */
  .print > * { clip-path:inset(0 0 100% 0); animation:print .3s steps(6) forwards; animation-delay:calc(var(--i)*90ms); }
  @keyframes print { to { clip-path:inset(0); } }

  @media (max-width:900px){
    body { grid-template-columns:1fr; padding:0 12px; gap:0; }
    #stage { height:60vh; }
    .sheet { margin-top:0; }
  }
  @media (prefers-reduced-motion:reduce){ .print > * { animation:none; clip-path:none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",

<body>

<section id="stage" aria-label="Schap met 3D-verpakkingen">
  <h1>AISLE 5<br>STUDIO<small>★ DIENSTEN IN HET SCHAP ★</small></h1>
  <canvas id="gl"></canvas>
  <div class="hint">KLIK OP EEN PRODUCT · DRAAI HET OM DE ACHTERKANT TE LEZEN</div>
</section>

<main class="sheet" id="receipt">
  <h2>*** AISLE 5 STUDIO ***</h2>
  <p class="center">KASSABON · GÅNG 5 · DIENSTEN</p>
  <p class="center" id="stamp"></p>
  <hr class="dash">

  <div class="aisle" id="aisle" role="list"></div>
  <hr class="dash">

  <section class="nutrition" id="facts" aria-live="polite"></section>

  <div id="basket"></div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import gsap from 'gsap';

/* ============ CONFIG ============ */
const USE_GLB = false;                 // true = laad /assets/models/{box,can,pouch}.glb uit Blender
const MAIL    = 'hello@aisle5.studio'; // checkout opent een mail naar dit adres
const VAT     = 0.21;

/* ============ DATA ============ */
const SERVICES = [
  { sku:'501234500001', name:'MERK IDENTITEIT', form:'box',   price:8500,  weight:'6 WEKEN',   color:'#e0261b', ink:'#fff',
    facts:[['Logosysteem','1'],['Lettertypes','2'],['Brandbook','48 p.'],['Bestaand ego','0%']], warn:'STERKE MENINGEN, SERIF-LETTERS' },
  { sku:'501234500002', name:'WEBSITE', form:'can',   price:18000, weight:'10 WEKEN',  color:'#0a6cff', ink:'#fff',
    facts:[['Pagina\'s','tot 12'],['Lighthouse','95+'],['CMS','ja'],['Pop-ups','0%']], warn:'SNELLE LAADTIJDEN' },
  { sku:'501234500003', name:'MOTION & 3D', form:'pouch', price:6200,  weight:'4 WEKEN',   color:'#ffd60a', ink:'#111',
    facts:[['Seconden','30'],['Formaten','5'],['Real-time','100%'],['Stockbeeld','0%']], warn:'ZEER BEWEGELIJKE INHOUD' },
  { sku:'501234500004', name:'SOCIAL CONTENT', form:'box', price:2400,  weight:'PER MAAND', color:'#1fa44a', ink:'#fff',
    facts:[['Posts','12'],['Reels','4'],['Stories','20'],['Trending audio','0%']], warn:'ENGAGEMENT' },
  { sku:'501234500005', name:'STRATEGIE SESSIE', form:'can', price:3000, weight:'2 DAGEN', color:'#ff7a00', ink:'#111',
    facts:[['Workshops','2'],['Post-its','∞'],['Actielijst','1'],['Vergaderingen','0%']], warn:'DUIDELIJKE KEUZES' },
  { sku:'501234500006', name:'RETAINER', form:'pouch', price:36000, weight:'12 MAANDEN', color:'#ff4fa3', ink:'#111',
    facts:[['Uren/maand','80'],['Reactietijd','4 u'],['Kantoorkoffie','100%'],['Briefings','0%']], warn:'LANGE SAMENWERKING' },
];
const bySku = sku => SERVICES.find(s => s.sku === sku);
const eur = n => '€ ' + n.toLocaleString('nl-NL', { minimumFractionDigits:2, maximumFractionDigits:2 });

/* ============ EAN-13 ============ */
const L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const G=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
const R=['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
const P=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function ean13(c12){
  const d=c12.split('').map(Number);
  const sum=d.reduce((s,n,i)=>s+n*(i%2?3:1),0);
  const full=c12+((10-(sum%10))%10), dg=full.split('').map(Number);
  let bits='101';
  for(let i=0;i<6;i++) bits+=(P[dg[0]][i]==='L'?L:G)[dg[i+1]];
  bits+='01010';
  for(let i=7;i<13;i++) bits+=R[dg[i]];
  return { full, bits: bits+'101' };
}
function barcodeSVG(c12,h=50){
  const {full,bits}=ean13(c12);
  const bars=[...bits].map((b,i)=>b==='1'?`<rect x="${i}" y="0" width="1" height="${h}"/>`:'').join('');
  return `<svg class="barcode" viewBox="0 0 95 ${h+12}" shape-rendering="crispEdges" role="img" aria-label="Barcode ${full}">${bars}<text x="47.5" y="${h+10}" text-anchor="middle" font-size="9" font-family="monospace">${full}</text></svg>`;
}

/* ============ LABEL TEXTURES (canvas) ============ */
function canvasTex(w,h,draw){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8;
  return t;
}
function drawFront(g,x,y,w,h,s){
  g.save(); g.translate(x,y); g.textBaseline='top';
  const m=w*0.04, band=Math.max(h*0.28,w*0.42);
  g.fillStyle=s.color; g.fillRect(0,0,w,h);
  g.fillStyle='#fff'; g.fillRect(m,m,w-2*m,h-2*m);
  g.fillStyle=s.color; g.fillRect(m,m,w-2*m,band);
  g.fillStyle=s.ink;
  const fs=w*0.1; g.font=`900 ${fs}px "Arial Black",Arial,sans-serif`;
  s.name.split(' ').forEach((wd,i)=>g.fillText(wd,m*2,m*2+i*fs*1.05,w-m*4));
  g.fillStyle='#111'; g.font=`bold ${w*0.06}px "Courier New",monospace`;
  g.fillText(`NETTO ${s.weight}`,m*2,band+m*2.5);
  g.font=`900 ${w*0.15}px "Arial Black",Arial,sans-serif`;
  g.fillText('€'+s.price.toLocaleString('nl-NL'),m*2,band+m*2.5+w*0.1,w-m*4);
  const {bits}=ean13(s.sku), bw=(w*0.55)/95, bh=h*0.1;
  const bx=m*2, by=h-m*2.5-bh;
  g.fillStyle='#fff'; g.fillRect(bx-6,by-6,95*bw+12,bh+12);
  g.fillStyle='#000'; [...bits].forEach((b,i)=>b==='1'&&g.fillRect(bx+i*bw,by,bw+0.4,bh));
  g.font=`bold ${w*0.12}px "Arial Black",Arial,sans-serif`; g.fillStyle=s.color;
  g.fillText('★ NIEUW',w-m*2-w*0.34,h-m*2.5-w*0.12);
  g.restore();
}
function drawFacts(g,x,y,w,h,s){
  g.save(); g.translate(x,y); g.textBaseline='top';
  const m=w*0.06;
  g.fillStyle='#fff'; g.fillRect(0,0,w,h);
  g.strokeStyle='#111'; g.lineWidth=w*0.012; g.strokeRect(m,m,w-2*m,h-2*m);
  let cy=m*1.4; const px=m*1.5, iw=w-3*m;
  g.fillStyle='#111'; g.font=`900 ${w*0.12}px "Arial Black",Arial,sans-serif`;
  g.fillText('DIENST FACTS',px,cy,iw); cy+=w*0.14;
  g.fillRect(px,cy,iw,w*0.025); cy+=w*0.05;
  const rh=w*0.085;
  const row=(a,b,bold)=>{
    g.font=`${bold?'bold ':''}${w*0.05}px "Courier New",monospace`;
    g.fillText(a,px,cy); g.textAlign='right'; g.fillText(b,px+iw,cy); g.textAlign='left';
    cy+=rh*0.9; g.fillRect(px,cy,iw,bold?w*0.012:w*0.004); cy+=rh*0.15;
  };
  row('Portie','1 project'); row('Levertijd',s.weight,true);
  s.facts.forEach(f=>row(f[0],f[1]));
  cy+=rh*0.3; g.font=`${w*0.04}px "Courier New",monospace`;
  g.fillText('⚠ KAN BEVATTEN: '+s.warn,px,cy,iw);
  g.restore();
}

/* ============ GEOMETRIE (procedureel, vervangt Blender-modellen) ============ */
const REF_H = 2.4;
const metal = new THREE.MeshStandardMaterial({ color:0xcfd2d6, metalness:1, roughness:.3 });

function buildBox(s){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new RoundedBoxGeometry(1.7,2.4,.7,4,.05),
    new THREE.MeshStandardMaterial({ color:s.color, roughness:.55 }));
  const front=new THREE.Mesh(new THREE.PlaneGeometry(1.6,2.3),
    new THREE.MeshStandardMaterial({ map:canvasTex(1024,1472,(c,w,h)=>drawFront(c,0,0,w,h,s)), roughness:.45 }));
  front.position.z=.352;
  const back=new THREE.Mesh(new THREE.PlaneGeometry(1.6,2.3),
    new THREE.MeshStandardMaterial({ map:canvasTex(1024,1472,(c,w,h)=>drawFacts(c,0,0,w,h,s)), roughness:.5 }));
  back.position.z=-.352; back.rotation.y=Math.PI;
  g.add(body,front,back); return g;
}
function buildCan(s){
  const g=new THREE.Group(), r=.75, h=1.9;
  const tex=canvasTex(2048,826,(c,w,hh)=>{
    c.fillStyle='#fff'; c.fillRect(0,0,w,hh);
    drawFront(c,w/2-350,0,700,hh,s);
    drawFacts(c,-hh*0.45,0,hh*0.9,hh,s);          // achterkant: helft links…
    drawFacts(c,w-hh*0.45,0,hh*0.9,hh,s);          // …en helft rechts van de naad
  });
  const side=new THREE.MeshStandardMaterial({ map:tex, roughness:.35, metalness:.3 });
  const geo=new THREE.CylinderGeometry(r,r,h,64,1,false,-Math.PI,Math.PI*2);
  g.add(new THREE.Mesh(geo,[side,metal,metal]));
  [h/2,-h/2].forEach(y=>{ const rim=new THREE.Mesh(new THREE.CylinderGeometry(r+.03,r+.03,.06,64),metal); rim.position.y=y; g.add(rim); });
  g.position.y=0; return g;
}
function buildPouch(s){
  const g=new THREE.Group(), W=1.7, H=2.3, D=.45;
  const geo=new THREE.BoxGeometry(W,H,D,24,32,1);
  const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const nx=pos.getX(i)/(W/2), ny=pos.getY(i)/(H/2), sz=Math.sign(pos.getZ(i))||1;
    const f=Math.pow(Math.max(0,1-nx*nx),.6)*Math.max(0,1-Math.pow(ny,6));
    pos.setZ(i, sz*(.04+.2*f));
  }
  geo.computeVertexNormals();
  const foil=new THREE.MeshStandardMaterial({ color:s.color, roughness:.25, metalness:.4 });
  const fr=new THREE.MeshStandardMaterial({ map:canvasTex(1024,1380,(c,w,h)=>drawFront(c,0,0,w,h,s)), roughness:.25, metalness:.25 });
  const bk=new THREE.MeshStandardMaterial({ map:canvasTex(1024,1380,(c,w,h)=>drawFacts(c,0,0,w,h,s)), roughness:.3 });
  g.add(new THREE.Mesh(geo,[foil,foil,foil,foil,fr,bk]));
  [H/2,-H/2].forEach(y=>{ const seal=new THREE.Mesh(new THREE.BoxGeometry(W,.14,.08),foil); seal.position.y=y; g.add(seal); });
  return g;
}
const builders={ box:buildBox, can:buildCan, pouch:buildPouch };

/* optioneel: echte Blender-GLB's */
const draco=new DRACOLoader().setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
const gltf=new GLTFLoader().setDRACOLoader(draco);
async function getModel(s){
  if(USE_GLB){
    try{
      const m=(await gltf.loadAsync(`/assets/models/${s.form}.glb`)).scene.clone(true);
      const tex=canvasTex(1024,1024,(c,w,h)=>drawFront(c,0,0,w,h,s)); tex.flipY=false;
      m.traverse(o=>{ if(o.isMesh && o.material.name==='Label'){ o.material=o.material.clone(); o.material.map=tex; } });
      return m;
    }catch(e){ console.warn('GLB niet gevonden, procedureel model gebruikt',e); }
  }
  return builders[s.form](s);
}

/* ============ SCENE ============ */
const canvas=document.querySelector('#gl');
const renderer=new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene();
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;
const camera=new THREE.PerspectiveCamera(30,1,.1,100);
const key=new THREE.DirectionalLight(0xffffff,1.6); key.position.set(3,6,6); scene.add(key);

const SPACING=2.7, ROWS=[1.9,-1.7];
const shelfMat=new THREE.MeshStandardMaterial({ color:0xb9b4a3, roughness:.6, metalness:.3 });
ROWS.forEach(y=>{ const b=new THREE.Mesh(new THREE.BoxGeometry(8.8,.12,1.5),shelfMat); b.position.set(0,y-1.27,0); scene.add(b); });

const products=[]; let hovered=null, selected=null;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

async function build(){
  const models=await Promise.all(SERVICES.map(getModel));
  SERVICES.forEach((s,i)=>{
    const row=Math.floor(i/3), col=i%3;
    const sway=new THREE.Group(); sway.add(models[i]);
    const hOff = s.form==='can' ? -(REF_H-2.0)/2 : s.form==='pouch' ? -.05 : 0;
    models[i].position.y=hOff;
    const pivot=new THREE.Group(); pivot.add(sway);
    pivot.position.set((col-1)*SPACING+(row?0.0:0), ROWS[row], 0);
    pivot.userData={ service:s, spin:0, sway, baseY:ROWS[row] };
    scene.add(pivot); products.push(pivot);
    gsap.from(pivot.position,{ y:7, duration:1.1, delay:i*.12, ease:'bounce.out' });
    gsap.from(pivot.rotation,{ y:Math.PI*2, duration:1.4, delay:i*.12, ease:'power3.out' });
  });
}

/* ============ INTERACTIE (GSAP) ============ */
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
const findPivot=o=>{ while(o && !o.userData.service) o=o.parent; return o; };

canvas.addEventListener('pointermove',e=>{
  const r=canvas.getBoundingClientRect();
  mouse.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(products,true)[0];
  const next=hit?findPivot(hit.object):null;
  if(next!==hovered){ if(hovered) leave(hovered); if(next) enter(next); hovered=next; canvas.style.cursor=next?'pointer':'default'; }
  if(hovered) gsap.to(hovered.rotation,{ x:-mouse.y*.3, y:hovered.userData.spin+mouse.x*.6, duration:.6, ease:'power3.out', overwrite:'auto' });
});
canvas.addEventListener('pointerleave',()=>{ if(hovered){ leave(hovered); hovered=null; } });
canvas.addEventListener('click',()=>{ if(hovered) select(hovered.userData.service.sku,true); });

function enter(p){
  gsap.to(p.scale,{ x:1.12,y:1.12,z:1.12, duration:.5, ease:'back.out(2)' });
  gsap.to(p.position,{ y:p.userData.baseY+.25, duration:.5, ease:'power3.out' });
}
function leave(p){
  gsap.to(p.scale,{ x:1,y:1,z:1, duration:.6, ease:'power3.out' });
  gsap.to(p.position,{ y:p.userData.baseY, duration:.6, ease:'power3.out' });
  gsap.to(p.rotation,{ x:0, y:p.userData.spin, duration:.8, ease:'power3.out', overwrite:'auto' });
}
function hop(p){
  gsap.timeline()
    .to(p.position,{ y:p.userData.baseY+1, duration:.25, ease:'power2.out' })
    .to(p.position,{ y:p.userData.baseY, duration:.6, ease:'bounce.out' });
}

function resize(){
  const w=canvas.clientWidth, h=canvas.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  const t=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const dist=Math.max(3.9/t, 4.6/(t*camera.aspect))+1;
  camera.position.set(0,.1,dist); camera.lookAt(0,.1,0);
  camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

gsap.ticker.add(time=>{
  if(!reduce) products.forEach((p,i)=>{ p.userData.sway.rotation.y=Math.sin(time*.6+i)*.25; });
  renderer.render(scene,camera);
});

/* ============ KASSABON-UI ============ */
const aisleEl=document.querySelector('#aisle'), factsEl=document.querySelector('#facts'), basketEl=document.querySelector('#basket');
document.querySelector('#stamp').textContent=new Date().toLocaleString('nl-NL',{dateStyle:'short',timeStyle:'short'}).toUpperCase();

aisleEl.innerHTML=SERVICES.map(s=>`
  <button class="item" role="listitem" data-sku="${s.sku}"><span class="l">${s.name}</span><span>${eur(s.price)}</span></button>`).join('');
aisleEl.addEventListener('click',e=>{ const b=e.target.closest('[data-sku]'); if(b) select(b.dataset.sku,true); });

function select(sku,spin){
  const s=bySku(sku), p=products.find(x=>x.userData.service.sku===sku);
  selected=sku;
  aisleEl.querySelectorAll('.item').forEach(b=>b.classList.toggle('on',b.dataset.sku===sku));
  factsEl.innerHTML=`
    <h3>Dienst Facts</h3>
    <div class="row"><span>Product</span><span>${s.name}</span></div>
    <div class="row"><span>Portie</span><span>1 project</span></div>
    <div class="row bold"><span>Levertijd</span><span>${s.weight}</span></div>
    ${s.facts.map(f=>`<div class="row"><span>${f[0]}</span><span>${f[1]}</span></div>`).join('')}
    <p class="warn">${s.warn}</p>
    ${barcodeSVG(s.sku,40)}
    <button class="full" data-add="${s.sku}">IN MANDJE · ${eur(s.price)} ✱</button>`;
  if(spin && p){
    p.userData.spin+=Math.PI*2;
    gsap.to(p.rotation,{ y:p.userData.spin, x:0, duration:1.2, ease:'power4.inOut', overwrite:'auto' });
  }
}
factsEl.addEventListener('click',e=>{
  const b=e.target.closest('[data-add]'); if(!b) return;
  add(b.dataset.add,1);
  const p=products.find(x=>x.userData.service.sku===b.dataset.add); if(p) hop(p);
});

/* ---- mandje ---- */
const cart=new Map(JSON.parse(localStorage.getItem('aisle5-cart')||'[]'));
function add(sku,d){
  const q=(cart.get(sku)||0)+d;
  q<=0?cart.delete(sku):cart.set(sku,q);
  localStorage.setItem('aisle5-cart',JSON.stringify([...cart]));
  renderBasket();
}
function renderBasket(printAnim){
  const rows=[...cart].map(([sku,q])=>{
    const s=bySku(sku);
    return `<div class="line"><span class="l">${q} × ${s.name}</span><span>${eur(s.price*q)}</span></div>
      <div class="sub">${sku} · ${s.weight}
        <button class="mini" data-dec="${sku}" aria-label="Minder">−</button><button class="mini" data-inc="${sku}" aria-label="Meer">+</button></div>
      ${barcodeSVG(sku,30)}`;
  }).join('');
  const sub=[...cart].reduce((t,[sku,q])=>t+bySku(sku).price*q,0);
  const count=[...cart.values()].reduce((a,b)=>a+b,0);
  basketEl.className=printAnim?'print':'';
  basketEl.innerHTML=`
    <h2 style="font-size:26px">— MANDJE —</h2>
    ${rows||'<p class="center">LEEG · PAK IETS UIT HET SCHAP</p>'}
    <hr class="dash">
    <div class="line"><span class="l">SUBTOTAAL</span><span>${eur(sub)}</span></div>
    <div class="line"><span class="l">BTW 21%</span><span>${eur(sub*VAT)}</span></div>
    <div class="line total"><span>TOTAAL</span><span>${eur(sub*(1+VAT))}</span></div>
    <p class="center">ARTIKELEN: ${count}</p>
    ${barcodeSVG('501234599999',46)}
    <p class="center">BEDANKT VOOR UW BEZOEK<br>GEEN RETOUR OP IDEEËN</p>
    <button class="full" id="checkout" ${count?'':'disabled'}>AFREKENEN →</button>`;
  if(printAnim) [...basketEl.children].forEach((c,i)=>c.style.setProperty('--i',i));
  if(count===0) document.querySelector('#checkout').style.opacity=.4;
}
basketEl.addEventListener('click',e=>{
  const inc=e.target.closest('[data-inc]'), dec=e.target.closest('[data-dec]');
  if(inc) add(inc.dataset.inc,1);
  if(dec) add(dec.dataset.dec,-1);
  if(e.target.id==='checkout' && cart.size){
    renderBasket(true);
    const lines=[...cart].map(([sku,q])=>`${q}x ${bySku(sku).name} (${sku}) - ${eur(bySku(sku).price*q)}`).join('%0D%0A');
    setTimeout(()=>{ location.href=`mailto:${MAIL}?subject=Bestelling%20Aisle%205&body=${lines}`; },1200);
  }
});

/* ============ START ============ */
renderBasket();
select(SERVICES[0].sku,false);
build();
</script>
</body>
</html>
