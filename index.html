  .barcode { width:100%; max-width:260px; display:block; margin:8px auto; fill:var(--ink); }

  button:hover, button:focus-visible { background:var(--red); outline:none; }
  button.full { width:100%; margin-top:10px; }

    gap:8px; cursor:pointer; text-transform:uppercase; padding:2px 0;

  .aisle .item .l { flex:1; overflow:hidden; white-space:nowrap; }
  .aisle .item .l::after { content:' ................................................'; opacity:.4; }

  /* Facts table */
  .nutrition {
    border:3px solid var(--ink); padding:6px 8px 10px;
    font:13px/1.4 'Space Mono',monospace; background:#fff;
  }
  .nutrition h3 {
    margin:0; font:900 30px/1 'Arial Black',Arial,sans-serif;

  .nutrition .warn::before { content:'⚠ NOTITIES: '; font-weight:700; }
  .nutrition button { font:700 14px 'Space Mono',monospace; }

  /* Print animation */
  .print > * {
    clip-path:inset(0 0 100% 0);
    animation:print .3s steps(6) forwards;
    animation-delay:calc(var(--i) * 90ms);
  }

  @media (max-width:900px){
    body { grid-template-columns:1fr; padding:0 12px; gap:0; }
    #stage { height:60vh; }
    .sheet { margin-top:0; }
  }
  @media (prefers-reduced-motion:reduce){
    .print > * { animation:none; clip-path:none; }

/* ============ EAN-13 ============ */
const L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const G=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
const R=['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
const P=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];

function ean13(c12){
  const d=c12.split('').map(Number);
  const sum=d.reduce((s,n,i)=>s+n*(i%2?3:1),0);
  const full=c12+((10-(sum%10))%10), dg=full.split('').map(Number);
  let bits='101';
  for(let i=0;i<6;i++) bits+=(P[dg[0]][i]==='L'?L:G)[dg[i+1]];
  bits+='01010';
  for(let i=7;i<13;i++) bits+=R[dg[i]];
  return { full, bits: bits+'101' };
}

function barcodeSVG(c12,h=50){
  const {full,bits}=ean13(c12);
  const bars=[...bits].map((b,i)=>b==='1'?`<rect x="${i}" y="0" width="1" height="${h}"/>`:'' ).join('');
  return `<svg class="barcode" viewBox="0 0 95 ${h+12}" shape-rendering="crispEdges" role="img" aria-label="Barcode ${full}">${bars}<text x="47.5" y="${h+10}" text-anchor="middle" font-size="9" font-family="monospace">${full}</text></svg>`;
}

function canvasTex(w,h,draw){
  const c=document.createElement('canvas');
  c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=8;
  return t;
}

function drawBottleFront(g,w,h,p){
  g.fillStyle=p.color;
  g.fillRect(0,0,w,h);

  const m=w*0.06;
  g.fillStyle='#f9f5ea';
  g.fillRect(m,m,w-2*m,h-2*m);

  g.fillStyle=p.color;
  g.fillRect(m,m,w-2*m,h*0.18);

  g.fillStyle=p.ink;
  g.textBaseline='top';
  g.font=`900 ${w*0.11}px "Arial Black",Arial,sans-serif`;
  const words=p.name.split(' ');
  words.forEach((wd,i)=>g.fillText(wd,m*1.6,m*1.7+i*w*0.11,w-m*3.2));

  g.font=`bold ${w*0.055}px "Courier New",monospace`;
  g.fillText(p.subtitle,m*1.6,h*0.42,w-m*3.2);

  g.font=`bold ${w*0.05}px "Courier New",monospace`;
  g.fillText(`VOL. ${p.volume}`,m*1.6,h*0.52,w-m*3.2);
  g.fillText(`AB ${p.facts.find(f=>f[0]==='Alcohol')?.[1] || ''}`,m*1.6,h*0.59,w-m*3.2);

  g.font=`900 ${w*0.1}px "Arial Black",Arial,sans-serif`;
  g.fillStyle=p.color;
  g.fillText('SELECT',m*1.6,h*0.70,w-m*3.2);

  g.fillStyle='#111';
  g.font=`900 ${w*0.12}px "Arial Black",Arial,sans-serif`;
  g.fillText('€'+p.price.toLocaleString('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2}),m*1.6,h*0.80,w-m*3.2);

  const {bits}=ean13(p.sku);
  const bw=(w*0.62)/95, bh=h*0.08;
  const bx=m*1.6, by=h*0.87;
  g.fillStyle='#fff';
  g.fillRect(bx-5,by-5,95*bw+10,bh+10);
  g.fillStyle='#000';
  [...bits].forEach((b,i)=>b==='1' && g.fillRect(bx+i*bw,by,bw+0.4,bh));
}

function drawBottleBack(g,w,h,p){
  g.fillStyle='#f9f5ea';
  g.fillRect(0,0,w,h);

  const m=w*0.07;
  let y=m*1.1;
  const left=m*1.2;
  const right=w-m*1.2;
  const lineH=h*0.085;

  g.fillStyle='#111';
  g.textBaseline='top';

  y += w*0.11;

  g.fillRect(left,y,right-left,w*0.02);
  y += w*0.05;

    g.font=`${bold?'bold ':''}${w*0.042}px "Courier New",monospace`;
    g.fillText(a,left,y);
    g.textAlign='right';
    g.fillText(b,right,y);
    g.textAlign='left';
    y += lineH*0.72;
    g.fillRect(left,y,right-left,bold ? w*0.012 : w*0.004);
    y += lineH*0.18;

  row('Portie','1 bottle');

  p.facts.forEach(f=>row(f[0],f[1]));
  row('Prijs',eur(p.price));

  y += lineH*0.3;
  g.font=`${w*0.038}px "Courier New",monospace`;
  const wrapped=`NOTITIES: ${p.warn}`;
  wrapText(g,wrapped,left,y,right-left,w*0.05);

  const {bits}=ean13(p.sku);
  const bw=(w*0.62)/95, bh=h*0.07;
  const bx=left, by=h*0.86;
  g.fillStyle='#fff';
  g.fillRect(bx-5,by-5,95*bw+10,bh+10);
  g.fillStyle='#000';
  [...bits].forEach((b,i)=>b==='1' && g.fillRect(bx+i*bw,by,bw+0.4,bh));
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split(' ');
  let line = '';
  for(let n=0; n<words.length; n++){
    const testLine = line + words[n] + ' ';
    const testWidth = ctx.measureText(testLine).width;
    if(testWidth > maxWidth && n > 0){
      ctx.fillText(line, x, y);
      line = words[n] + ' ';
      y += lineHeight;
    }else{
      line = testLine;
    }
  }
  ctx.fillText(line, x, y);
}

/* ============ BOTTLE BUILDERS ============ */
function buildBottle(p, profile='tall'){
  const group = new THREE.Group();

  let bodyRadius = 0.42;
  let bodyHeight = 1.95;
  let neckRadius = 0.12;
  let neckHeight = 0.42;
  let shoulderY = bodyHeight/2 - 0.08;
  let capRadius = 0.14;
  let capHeight = 0.12;

  if(profile==='round'){
    bodyRadius = 0.48;
    bodyHeight = 1.75;
    neckRadius = 0.14;
    neckHeight = 0.34;
    capRadius = 0.16;
  }

  if(profile==='square'){
    bodyRadius = 0.44;
    bodyHeight = 1.90;
    neckRadius = 0.11;
    neckHeight = 0.34;
    capRadius = 0.13;
  }

  if(profile==='slim'){
    bodyRadius = 0.36;
    bodyHeight = 2.10;
    neckRadius = 0.10;
    neckHeight = 0.38;
    capRadius = 0.12;
  }

  if(profile==='dark'){
    bodyRadius = 0.40;
    bodyHeight = 2.00;
    neckRadius = 0.11;
    neckHeight = 0.36;
    capRadius = 0.13;
  }

  const glassMat = new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(p.glass),
    transmission: 0.22,
    thickness: 0.6,
    roughness: 0.28,
    metalness: 0.0,
    transparent: true,
    opacity: 0.96,
    reflectivity: 0.35,
    clearcoat: 0.25,
    clearcoatRoughness: 0.25
  });

  let body;
  if(profile==='square'){
    body = new THREE.Mesh(
      new THREE.BoxGeometry(0.85, bodyHeight, 0.62, 6, 10, 6),
      glassMat
    );
  } else {
    body = new THREE.Mesh(
      new THREE.CylinderGeometry(bodyRadius*0.92, bodyRadius, bodyHeight, 48),
      glassMat
    );
  }
  group.add(body);

  const shoulder = new THREE.Mesh(
    new THREE.CylinderGeometry(neckRadius*1.5, bodyRadius*0.88, 0.28, 48),
    glassMat
  );
  shoulder.position.y = shoulderY;
  group.add(shoulder);

  const neck = new THREE.Mesh(
    new THREE.CylinderGeometry(neckRadius, neckRadius*1.05, neckHeight, 32),
    glassMat
  );
  neck.position.y = shoulderY + 0.27;
  group.add(neck);

  const cap = new THREE.Mesh(
    new THREE.CylinderGeometry(capRadius, capRadius, capHeight, 32),
    new THREE.MeshStandardMaterial({ color:0x111111, roughness:.65, metalness:.15 })
  );
  cap.position.y = shoulderY + 0.27 + neckHeight/2 + capHeight/2 - 0.02;
  group.add(cap);

  const frontLabel = new THREE.Mesh(
    new THREE.PlaneGeometry(profile==='square' ? 0.62 : 0.66, 1.05),
    makeBottleLabelFront(p)
  );
  frontLabel.position.set(0, -0.08, profile==='square' ? 0.315 : bodyRadius + 0.01);
  group.add(frontLabel);

  const backLabel = new THREE.Mesh(
    new THREE.PlaneGeometry(profile==='square' ? 0.58 : 0.60, 0.95),
    makeBottleLabelBack(p)
  );
  backLabel.position.set(0, -0.05, -(profile==='square' ? 0.315 : bodyRadius + 0.01));
  backLabel.rotation.y = Math.PI;
  group.add(backLabel);

  const liquid = new THREE.Mesh(
    profile==='square'
      ? new THREE.BoxGeometry(0.73, bodyHeight*0.72, 0.52, 4, 4, 4)
      : new THREE.CylinderGeometry(bodyRadius*0.78, bodyRadius*0.82, bodyHeight*0.72, 40),
    new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(p.color),
      transmission: 0.0,
      roughness: 0.2,
      transparent: true,
      opacity: 0.80
    })
  );
  liquid.position.y = -bodyHeight*0.08;
  group.add(liquid);

  return group;
}

const builders = {
  bottleTall:  (p)=>buildBottle(p,'tall'),
  bottleRound: (p)=>buildBottle(p,'round'),
  bottleSquare:(p)=>buildBottle(p,'square'),
  bottleSlim:  (p)=>buildBottle(p,'slim'),
  bottleDark:  (p)=>buildBottle(p,'dark')
};

const canvas = document.querySelector('#gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;

const camera = new THREE.PerspectiveCamera(30,1,.1,100);

const key = new THREE.DirectionalLight(0xffffff,1.8);
key.position.set(3,6,6);
scene.add(key);

const fill = new THREE.DirectionalLight(0xffffff,.8);
fill.position.set(-5,3,2);
scene.add(fill);

const ambient = new THREE.AmbientLight(0xffffff,.65);
scene.add(ambient);

const SPACING = 2.7;
const ROWS = [1.9,-1.5];
const shelfMat = new THREE.MeshStandardMaterial({ color:0xb9b4a3, roughness:.6, metalness:.3 });

ROWS.forEach(y=>{
  const b = new THREE.Mesh(new THREE.BoxGeometry(8.8,.12,1.7), shelfMat);
  b.position.set(0,y-1.27,0);
  scene.add(b);
});

const backWall = new THREE.Mesh(
  new THREE.PlaneGeometry(16,12),
  new THREE.MeshStandardMaterial({ color:0xe4dfd2, roughness:1 })
);
backWall.position.set(0,0,-2.1);
scene.add(backWall);

const products = [];
let hovered = null, selected = null;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

async function build(){
  PRODUCTS.forEach((p,i)=>{
    const model = builders[p.form](p);
    const row = Math.floor(i/3), col = i%3;

    const sway = new THREE.Group();
    sway.add(model);

    model.position.y = 0.15;

    const pivot = new THREE.Group();
    pivot.add(sway);

    pivot.position.set((col-1)*SPACING, ROWS[row], 0);
    pivot.userData = { product:p, spin:0, sway, baseY:ROWS[row] };

    scene.add(pivot);
    products.push(pivot);

    gsap.from(pivot.position,{ y:7, duration:1.1, delay:i*.12, ease:'bounce.out' });
    gsap.from(pivot.rotation,{ y:Math.PI*2, duration:1.4, delay:i*.12, ease:'power3.out' });
  });
}

/* ============ INTERACTIE ============ */
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();

const findPivot = o => {
  while(o && !o.userData.product) o = o.parent;
  return o;
};

canvas.addEventListener('pointermove',e=>{
  const r = canvas.getBoundingClientRect();
  mouse.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera);

  const hit = ray.intersectObjects(products,true)[0];
  const next = hit ? findPivot(hit.object) : null;

  if(next !== hovered){
    if(hovered) leave(hovered);
    if(next) enter(next);
    hovered = next;
    canvas.style.cursor = next ? 'pointer' : 'default';
  }

  if(hovered){
    gsap.to(hovered.rotation,{
      x:-mouse.y*.16,
      y:hovered.userData.spin + mouse.x*.32,
      duration:.6,
      ease:'power3.out',
      overwrite:'auto'
    });
  }
});

canvas.addEventListener('pointerleave',()=>{
  if(hovered){ leave(hovered); hovered=null; }
});

canvas.addEventListener('click',()=>{
  if(hovered) selectProduct(hovered.userData.product.sku,true);
});

function enter(p){
  gsap.to(p.scale,{ x:1.12,y:1.12,z:1.12, duration:.5, ease:'back.out(2)' });
  gsap.to(p.position,{ y:p.userData.baseY+.25, duration:.5, ease:'power3.out' });
}
function leave(p){
  gsap.to(p.scale,{ x:1,y:1,z:1, duration:.6, ease:'power3.out' });
  gsap.to(p.position,{ y:p.userData.baseY, duration:.6, ease:'power3.out' });
  gsap.to(p.rotation,{ x:0, y:p.userData.spin, duration:.8, ease:'power3.out', overwrite:'auto' });
}
function hop(p){
  gsap.timeline()
    .to(p.position,{ y:p.userData.baseY+1, duration:.25, ease:'power2.out' })
    .to(p.position,{ y:p.userData.baseY, duration:.6, ease:'bounce.out' });
}

function resize(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect = w/h;
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const dist = Math.max(4.0/t, 4.8/(t*camera.aspect)) + 1.8;
  camera.position.set(0,.2,dist);
  camera.lookAt(0,.1,0);
  camera.updateProjectionMatrix();
}
addEventListener('resize',resize);
resize();

gsap.ticker.add(time=>{
  if(!reduce){
    products.forEach((p,i)=>{
      p.userData.sway.rotation.y = Math.sin(time*.6+i)*.12;
    });
  }
  renderer.render(scene,camera);
});

/* ============ KASSABON-UI ============ */
const aisleEl  = document.querySelector('#aisle');
const factsEl  = document.querySelector('#facts');
const basketEl = document.querySelector('#basket');

document.querySelector('#stamp').textContent =
  new Date().toLocaleString('nl-NL',{ dateStyle:'short', timeStyle:'short' }).toUpperCase();

aisleEl.innerHTML = PRODUCTS.map(p=>`
  <button class="item" role="listitem" data-sku="${p.sku}">
    <span class="l">${p.name}</span>
    <span>${eur(p.price)}</span>
  </button>
`).join('');

aisleEl.addEventListener('click',e=>{
  const b = e.target.closest('[data-sku]');
  if(b) selectProduct(b.dataset.sku,true);
});

function selectProduct(sku,spin){
  const p = bySku(sku);
  const mesh = products.find(x=>x.userData.product.sku===sku);
  selected = sku;

  aisleEl.querySelectorAll('.item').forEach(b=>b.classList.toggle('on', b.dataset.sku===sku));

  factsEl.innerHTML = `
    <h3>Bottle Facts</h3>
    <div class="row"><span>Product</span><span>${p.name}</span></div>
    <div class="row"><span>Type</span><span>${p.subtitle}</span></div>
    <div class="row bold"><span>Inhoud</span><span>${p.volume}</span></div>
    ${p.facts.map(f=>`<div class="row"><span>${f[0]}</span><span>${f[1]}</span></div>`).join('')}
    <div class="row"><span>Prijs</span><span>${eur(p.price)}</span></div>
    <p class="warn">${p.warn}</p>
    ${barcodeSVG(p.sku,40)}
    <button class="full" data-add="${p.sku}">IN MANDJE · ${eur(p.price)} ✱</button>
  `;

  if(spin && mesh){
    mesh.userData.spin += Math.PI*2;
    gsap.to(mesh.rotation,{
      y:mesh.userData.spin,
      x:0,
      duration:1.2,
      ease:'power4.inOut',
      overwrite:'auto'
    });
  }
}

factsEl.addEventListener('click',e=>{
  const b = e.target.closest('[data-add]');
  if(!b) return;
  add(b.dataset.add,1);
  const p = products.find(x=>x.userData.product.sku===b.dataset.add);
  if(p) hop(p);
});

/* ============ MANDJE ============ */
const cart = new Map(JSON.parse(localStorage.getItem('whiskey-aisle-cart')||'[]'));

function add(sku,d){
  const q = (cart.get(sku)||0) + d;
  q<=0 ? cart.delete(sku) : cart.set(sku,q);
  localStorage.setItem('whiskey-aisle-cart',JSON.stringify([...cart]));
  renderBasket();
}

function renderBasket(printAnim){
  const rows = [...cart].map(([sku,q])=>{
    const p = bySku(sku);
    return `<div class="line"><span class="l">${q} × ${p.name}</span><span>${eur(p.price*q)}</span></div>
      <div class="sub">${sku} · ${p.volume}
        <button class="mini" data-dec="${sku}" aria-label="Minder">−</button><button class="mini" data-inc="${sku}" aria-label="Meer">+</button>
      </div>
      ${barcodeSVG(sku,30)}`;
  }).join('');

  const sub = [...cart].reduce((t,[sku,q])=>t+bySku(sku).price*q,0);
  const count = [...cart.values()].reduce((a,b)=>a+b,0);

  basketEl.className = printAnim ? 'print' : '';
  basketEl.innerHTML = `
    <h2 style="font-size:26px">— MANDJE —</h2>
    ${rows || '<p class="center">LEEG · KIES EEN FLES UIT HET SCHAP</p>'}
    <hr class="dash">
    <div class="line"><span class="l">SUBTOTAAL</span><span>${eur(sub)}</span></div>
    <div class="line"><span class="l">BTW 21%</span><span>${eur(sub*VAT)}</span></div>
    <div class="line total"><span>TOTAAL</span><span>${eur(sub*(1+VAT))}</span></div>
    <p class="center">ARTIKELEN: ${count}</p>
    ${barcodeSVG('501234599999',46)}
    <p class="center">BEDANKT VOOR UW BEZOEK<br>GENIET VERANTWOORD</p>
    <button class="full" id="checkout" ${count?'':'disabled'}>AFREKENEN →</button>
  `;

  if(printAnim) [...basketEl.children].forEach((c,i)=>c.style.setProperty('--i',i));
  if(count===0) document.querySelector('#checkout').style.opacity=.4;
}

basketEl.addEventListener('click',e=>{
  const inc = e.target.closest('[data-inc]');
  const dec = e.target.closest('[data-dec]');
  if(inc) add(inc.dataset.inc,1);
  if(dec) add(dec.dataset.dec,-1);

  if(e.target.id==='checkout' && cart.size){
    renderBasket(true);
    const lines = [...cart].map(([sku,q])=>`${q}x ${bySku(sku).name} (${sku}) - ${eur(bySku(sku).price*q)}`).join('%0D%0A');
    setTimeout(()=>{
      location.href=`mailto:${MAIL}?subject=Bestelling%20The%20Whiskey%20Aisle&body=${lines}`;
    },1200);
  }
});

/* ============ START ============ */
renderBasket();
selectProduct(PRODUCTS[0].sku,false);
build();
</script>
